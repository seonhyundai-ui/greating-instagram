name: Greating Instagram Data Collect

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: manual
        type: string

concurrency:
  group: greating-instagram-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore .env
        shell: bash
        env:
          DOTENV_B64: ${{ secrets.DOTENV_B64 }}
        run: |
          echo "$DOTENV_B64" | base64 --decode > .env

      - name: Run daily collector
        shell: bash
        env:
          TRIGGER_SOURCE: ${{ github.event.inputs.source || 'manual' }}
          GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
        run: |
          echo "============================================================"
          echo "GitHub Actions trigger source: ${TRIGGER_SOURCE}"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "Google auth: Service Account"
          echo "============================================================"
          python -u -m scripts.daily_collect
